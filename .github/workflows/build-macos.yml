name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-macos:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS app
        run: |
          pyinstaller -w -n "PSD四宫格批量替换工具" four_grid_app_auto.py

      - name: Zip app
        run: |
          cd dist
          zip -r PSD四宫格批量替换工具-macOS.zip PSD四宫格批量替换工具.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSD四宫格批量替换工具-macOS
          path: dist/PSD四宫格批量替换工具-macOS.zip
